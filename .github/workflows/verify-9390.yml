name: Verify 9390

# Temporary verification for the estop phase-1 branch, run on the contributor's
# fork. Not part of the pull request: the delivery branch does not carry this file.
# Mirrors the commands of the upstream Quality Gate on GitHub-hosted runners.

on:
  push:
    branches: ["ci/9390-verificacion"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Base of the delivery branch (origin/master when the branch was rebased).
  BASE_SHA: 2f3bcab4420b3b3b25de455e5d9aff58a6d76239

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep mold expect python3 libasound2-dev jq
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: cargo check
        run: cargo check --workspace --locked --exclude zeroclaw-desktop

  runtime-lib:
    name: runtime lib tests (estop filters)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep mold expect python3 libasound2-dev jq
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: zeroclaw-runtime --lib
        run: >
          cargo test --locked -p zeroclaw-runtime --lib -- --test-threads=1
          dispatch_gate shell_job_is_refused deferred_not_consumed estop rpc:: otp i18n
      - name: zeroclaw-runtime process-wide gate tests
        run: >
          cargo test --locked -p zeroclaw-runtime
          --test estop_gate_process --test estop_gate_conflict -- --test-threads=1

  other-crates:
    name: api, providers, hardware, tools
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep mold expect python3 libasound2-dev jq
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: zeroclaw-api
        run: cargo test --locked -p zeroclaw-api --lib -- --test-threads=1 dispatch_gate
      - name: zeroclaw-providers (external agent providers)
        run: >
          cargo test --locked -p zeroclaw-providers --lib -- --test-threads=1
          kilocli acp_cli grok_cli antigravity_cli
      - name: zeroclaw-hardware
        run: cargo test --locked -p zeroclaw-hardware --lib -- --test-threads=1 dispatch_gate
      - name: zeroclaw-tools (pipeline)
        run: cargo test --locked -p zeroclaw-tools --lib -- --test-threads=1 pipeline

  binary:
    name: zeroclaw binary and component tests (estop)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep mold expect python3 libasound2-dev jq
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: zeroclaw --bin estop tests
        run: cargo test --locked --bin zeroclaw estop
      - name: component estop tests
        run: cargo test --locked --test component estop

  generated:
    name: generated files (openrpc, fluent)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep mold expect python3 libasound2-dev jq
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: openrpc --check
        run: cargo run --locked -p xtask --bin generate -- openrpc --check
      - name: fluent check
        run: cargo run --locked -p xtask --bin fluent -- check

  lint:
    name: clippy, rustdoc, repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          use-blacksmith: 'false'
          cache-on-failure: true
          shared-key: verify-9390
      - name: Install system dependencies
        run: bash scripts/ci/apt_install.sh libudev-dev ripgrep
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Clippy
        run: >
          bash scripts/ci/run_clippy.sh --scope workspace
          --summary-title "Lint diagnostics" --log-name cargo-clippy.log
      - name: Rustdoc warnings gate
        run: cargo doc --no-deps --workspace --exclude zeroclaw-desktop
      - name: Comment hygiene gate
        run: |
          bash scripts/ci/comment_hygiene_gate.test.sh
          bash scripts/ci/comment_hygiene_gate.sh

  docs:
    name: docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Docs quality gate
        run: bash scripts/ci/docs_quality_gate.sh
      - name: Docs link gate (added links)
        run: bash scripts/ci/docs_links_gate.sh
      - name: Docs link gate (all internal links)
        run: python3 scripts/ci/check_internal_docs_links.py
      - name: Docs link checker unit tests
        run: python3 scripts/ci/check_internal_docs_links_test.py
